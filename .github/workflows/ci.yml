name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax compile check
        run: |
          python -m compileall -q .

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "tools.schemas",
              "tools.sim",
              "tools.observables",
              "tools.reliability",
              "agent.llm",
              "agent.tool_registry",
              "agent.subagents",
              "agent.orchestrator",
          ]

          for name in modules:
              importlib.import_module(name)

          print("Import smoke test passed")
          PY
